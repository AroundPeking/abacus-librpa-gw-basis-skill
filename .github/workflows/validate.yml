name: Validate skill
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tests/test_public_skill.py
      - run: python tests/test_gaussian_aux_orb.py
      - uses: actions/checkout@v4
        with:
          repository: AroundPeking/abacus-librpa-gw-database
          ref: 210c0729846bf8593651a3c2951ecf333f895934
          path: database-source
      - run: python scripts/validate_database_release.py --database-root database-source
      - run: python scripts/public_scan.py .
